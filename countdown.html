<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 元旦倒计时</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecf4;
    background: linear-gradient(135deg, #0b1026 0%, #1b1740 45%, #08243d 100%);
    background-size: 220% 220%;
    animation: bg-drift 26s ease-in-out infinite;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 68% 14%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 84% 62%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 32% 78%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 52% 42%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 66%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 44% 8%, rgba(255,255,255,.45) 50%, transparent 51%);
  }
  @keyframes bg-drift {
    0%, 100% { background-position: 0% 40%; }
    50% { background-position: 100% 60%; }
  }
  .card {
    position: relative;
    padding: 2.5rem 3rem;
    border-radius: 20px;
    background: rgba(13, 17, 38, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    text-align: center;
    max-width: 92vw;
  }
  .eyebrow { margin: 0 0 1.25rem; letter-spacing: 0.35em; font-size: 0.9rem; color: #9db0d6; }
  .count { display: flex; align-items: baseline; justify-content: center; gap: 0.35em; font-variant-numeric: tabular-nums; }
  .unit { display: flex; flex-direction: column; align-items: center; min-width: 1.6em; }
  .unit span {
    font-family: ui-monospace, Consolas, monospace;
    font-size: clamp(2.2rem, 10vw, 5.5rem);
    font-weight: 700;
    line-height: 1.1;
    text-shadow: 0 0 24px rgba(120, 160, 255, 0.35);
  }
  .unit label { margin-top: 0.4rem; font-size: 0.85rem; color: #9db0d6; letter-spacing: 0.2em; }
  .sep {
    font-family: ui-monospace, Consolas, monospace;
    font-size: clamp(1.7rem, 7vw, 4rem);
    color: #5a6c96;
    transform: translateY(-0.35em);
  }
  .seconds span.tick { animation: pop 0.45s ease; }
  @keyframes pop {
    0% { transform: scale(1.12); color: #a5c4ff; }
    100% { transform: scale(1); }
  }
  .meta { margin: 1.75rem 0 0.5rem; color: #9db0d6; font-size: 0.95rem; }
  .progress {
    width: min(420px, 70vw);
    height: 6px;
    margin: 0 auto;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, #6ea8ff, #b48bff);
    transition: width 0.4s ease;
  }
  .note { margin: 2rem 0 0; font-size: 0.8rem; color: #7285ad; line-height: 1.8; }
  .note a { color: #9db0d6; }
  @media (prefers-reduced-motion: reduce) {
    body, .seconds span.tick { animation: none; }
  }
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow" id="eyebrow">距离 2027 年元旦</p>
  <div class="count">
    <div class="unit"><span id="days">--</span><label>天</label></div>
    <div class="sep">:</div>
    <div class="unit"><span id="hours">--</span><label>时</label></div>
    <div class="sep">:</div>
    <div class="unit"><span id="minutes">--</span><label>分</label></div>
    <div class="sep">:</div>
    <div class="unit seconds"><span id="seconds">--</span><label>秒</label></div>
  </div>
  <p class="meta" id="meta"></p>
  <div class="progress"><div id="bar"></div></div>
  <p class="note">此页面由浏览器中的 JavaScript 实时计算，服务器只提供了一个静态文件<br><a href="./">← 返回博客首页</a></p>
</main>
<script>
(function () {
  var target = new Date(2027, 0, 1, 0, 0, 0);
  var $ = function (id) { return document.getElementById(id); };
  var els = { d: $("days"), h: $("hours"), m: $("minutes"), s: $("seconds"), meta: $("meta"), bar: $("bar"), eyebrow: $("eyebrow") };
  var lastS = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;

    if (diff <= 0) {
      els.eyebrow.textContent = "2027 已经到来";
      els.d.textContent = "0";
      els.h.textContent = "00";
      els.m.textContent = "00";
      els.s.textContent = "00";
      els.meta.textContent = "新年快乐 🎉";
      return;
    }

    els.d.textContent = Math.floor(diff / 86400000);
    els.h.textContent = pad(Math.floor(diff / 3600000) % 24);
    els.m.textContent = pad(Math.floor(diff / 60000) % 60);
    var s = pad(Math.floor(diff / 1000) % 60);
    if (s !== lastS) {
      els.s.textContent = s;
      els.s.classList.remove("tick");
      void els.s.offsetWidth;
      els.s.classList.add("tick");
      lastS = s;
    }

    var year = now.getFullYear();
    var start = new Date(year, 0, 1);
    var end = new Date(year + 1, 0, 1);
    var pct = (now - start) / (end - start) * 100;
    els.bar.style.width = pct.toFixed(4) + "%";
    els.meta.textContent = year + " 年已过去 " + pct.toFixed(2) + "%";
  }

  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
