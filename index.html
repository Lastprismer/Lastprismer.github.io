<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starfall Sea</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2f6fc;
    background: #2e609f;
    overflow: hidden;
  }
  /* CSS 色块层：WebGL 不可用时的兜底背景 */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .bg i { position: absolute; display: block; border-radius: 50%; filter: blur(70px); }
  .bg .b1 {
    width: 55vmax; height: 55vmax; left: -12vmax; top: -18vmax;
    background: #9cc2f0; opacity: .5;
    animation: drift1 21s ease-in-out infinite alternate;
  }
  .bg .b2 {
    width: 48vmax; height: 48vmax; right: -14vmax; bottom: -16vmax;
    background: #17325e; opacity: .78;
    animation: drift2 27s ease-in-out infinite alternate;
  }
  .bg .b3 {
    width: 36vmax; height: 36vmax; left: 30%; top: 42%;
    background: #d7e7f9; opacity: .26;
    animation: drift3 33s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(9vw, 12vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-8vw, -10vh) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-12vw, -14vh) scale(1.2); } }
  /* WebGL 噪声着色器画布 */
  #shader {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  /* 背景音乐按钮 */
  #music-btn {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 3;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s;
  }
  #music-btn:hover { background: rgba(255, 255, 255, 0.24); }
  @media (prefers-reduced-motion: reduce) {
    .bg i { animation: none; }
  }
</style>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<canvas id="shader"></canvas>
<audio id="bgm" src="assets/starfall-sea.mp3" loop preload="metadata"></audio>
<button id="music-btn" type="button" aria-label="播放背景音乐">🔇</button>
<script>
(function () {
  var canvas = document.getElementById("shader");
  if (!canvas) return;
  var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) return; // WebGL 不可用时保留 CSS 色块背景

  var vsSrc = "attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }";
  var fsSrc = [
    "precision highp float;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }",
    "float noise(vec2 p){",
    "  vec2 i = floor(p);",
    "  vec2 f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
    "}",
    "float fbm(vec2 p){",
    "  float v = 0.0;",
    "  float a = 0.5;",
    "  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);",
    "  for (int i = 0; i < 5; i++) { v += a * noise(p); p = rot * p * 2.03; a *= 0.5; }",
    "  return v;",
    "}",
    "void main(){",
    "  vec2 uv = gl_FragCoord.xy / u_res.xy;",
    "  vec2 p = uv;",
    "  p.x *= u_res.x / u_res.y;",
    "  float t = u_time * 0.06;",
    "  vec2 q = vec2(fbm(p * 1.4 + t), fbm(p * 1.4 + vec2(5.2, 1.3) - t * 0.7));",
    "  vec2 r = vec2(fbm(p * 1.4 + 2.2 * q + vec2(1.7, 9.2) + t * 0.4), fbm(p * 1.4 + 2.2 * q + vec2(8.3, 2.8) - t * 0.3));",
    "  float f = fbm(p * 1.4 + 2.5 * r);",
    "  vec3 c1 = vec3(0.090, 0.196, 0.369);",
    "  vec3 c2 = vec3(0.180, 0.376, 0.624);",
    "  vec3 c3 = vec3(0.612, 0.760, 0.941);",
    "  vec3 c4 = vec3(0.955, 0.975, 1.0);",
    "  vec3 col = mix(c1, c2, smoothstep(0.18, 0.55, f));",
    "  col = mix(col, c3, smoothstep(0.55, 0.78, f + 0.3 * q.x));",
    "  col = mix(col, c4, 0.65 * smoothstep(0.80, 0.98, f * f + 0.35 * r.y));",
    "  col *= 1.0 - 0.28 * length(uv - vec2(0.5, 0.45));",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  function makeShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
    return s;
  }
  var vs = makeShader(gl.VERTEX_SHADER, vsSrc);
  var fs = makeShader(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return;

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, "u_res");
  var uTime = gl.getUniformLocation(prog, "u_time");

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t0 = (window.performance && performance.now) ? performance.now() : 0;

  function frame(now) {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, reduce ? 25.0 : (now - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
(function () {
  var audio = document.getElementById("bgm");
  var btn = document.getElementById("music-btn");
  if (!audio || !btn) return;

  function sync() {
    btn.textContent = audio.paused ? "🔇" : "🔊";
    btn.setAttribute("aria-label", audio.paused ? "播放背景音乐" : "暂停背景音乐");
  }

  btn.addEventListener("click", function () {
    if (audio.paused) {
      audio.play().catch(function () {}); // 播放失败（如音频还没就绪）时图标由事件回调纠正
    } else {
      audio.pause();
    }
  });
  audio.addEventListener("play", sync);
  audio.addEventListener("pause", sync);
  sync();
})();
</script>
</body>
</html>
